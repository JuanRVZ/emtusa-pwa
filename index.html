<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Bus Huelva</title>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bus Huelva" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <div id="map"></div>
  <header id="bar">
    <label class="pill">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar parada o línea" autocomplete="off" autocorrect="off" enterkeyhint="search" />
    </label>
    <button id="go" class="fab" aria-label="Cómo llegar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5a2 2 0 0 1 2-2h1M15 6v12.5a2 2 0 0 0 2 2h1"/><circle cx="9" cy="19.5" r="2"/><circle cx="15" cy="4.5" r="2"/></svg></button>
    <button id="loc" class="fab" aria-label="Paradas cercanas"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20.5 3.5 3.8 10.4c-.8.3-.7 1.5.1 1.7l6.5 1.8 1.8 6.5c.2.8 1.4.9 1.7.1L20.5 3.5Z"/></svg></button>
  </header>
  <nav id="lines" aria-label="Líneas"></nav>
  <ul id="results" hidden></ul>

  <section id="lsheet" class="sheet" hidden>
    <div class="grab"><i></i></div>
    <div id="lhead"></div>
    <div id="seg"></div>
    <div id="mine" hidden></div>
    <ul id="slist"></ul>
  </section>

  <section id="sheet" class="sheet auto" hidden>
    <div class="grab"><i></i></div>
    <div class="head">
      <div><h2 id="sname"></h2><small id="smeta"></small></div>
      <div class="acts"><button id="fav" class="round" aria-label="Favorita">☆</button><button id="close" class="round" aria-label="Cerrar">✕</button></div>
    </div>
    <ul id="arr"></ul>
  </section>
  <div id="status"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
